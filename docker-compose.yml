services:
  postgres:
    image: postgres:17-alpine
    container_name: sqltutor-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: sqltutor
      POSTGRES_PASSWORD: sqltutor_dev
      POSTGRES_DB: sqltutor

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d

volumes:
  postgres_data: